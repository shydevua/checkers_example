name: checkers_app
description: Russian checkers against a computer opponent with three levels.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.3
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  meta: ^1.18.0
  shared_preferences: ^2.5.6

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true

# Regenerate with: flutter test tool/render_icon.dart
#                  dart run flutter_launcher_icons
#                  dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F0D9B5"
  image: assets/branding/splash.png
  android_12:
    color: "#F0D9B5"
    image: assets/branding/splash.png
