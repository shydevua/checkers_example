include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.config.dart"
    - "**/*.module.dart"
    - lib/core/l10n/generated/**
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # Apps and internal packages: API docs are required only where the
    # contract matters (`/// Throws` on every throwing public method).
    public_member_api_docs: false
